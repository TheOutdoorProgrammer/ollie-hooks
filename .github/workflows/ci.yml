name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # A hook runs wherever Claude Code does. The Windows job exists because
      # tool paths arrive with backslashes there, which has already broken a
      # path-matching rule once.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # -race everywhere: hooks fire concurrently across parallel tool calls,
      # so shared state is a real failure mode rather than a theoretical one.
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The docs are generated from the registered rules, so the only way they
      # can drift is if someone edits a rule and forgets to regenerate. That is
      # exactly what this catches.
      - name: docs are up to date
        run: |
          make docs
          git diff --exit-code -- docs/ README.md config.example.toml || {
            echo "::error::docs are stale — run 'make docs' and commit the result"
            exit 1
          }

  # The install script fetches and runs a binary that gates every tool call, so
  # a shell bug here is a security problem rather than an inconvenience.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
